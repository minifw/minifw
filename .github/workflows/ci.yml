name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm changeset status --since=origin/main
